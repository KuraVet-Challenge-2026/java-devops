# =====================================================================
# Perfil ORACLE - banco da FIAP
# Usado nas disciplinas de Java Advanced e Mastering Database.
#
# As credenciais vem de variaveis de ambiente ou do
# application-local.properties, que NAO e versionado.
# =====================================================================

spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.flyway.locations=classpath:db/migration/oracle