# =====================================================================
# Perfil AZURE - Banco de Dados SQL do Azure (PaaS)
# Usado na disciplina de DevOps Tools & Cloud Computing.
#
# Todos os valores abaixo sao injetados como Configuracoes de
# Aplicativo pelo script infra\05-appsettings.ps1.
# Nenhum segredo existe neste arquivo.
# =====================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.flyway.locations=classpath:db/migration/sqlserver

# Em nuvem o cache de template fica ligado (ganho de performance)
spring.thymeleaf.cache=true