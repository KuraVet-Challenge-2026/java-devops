# =====================================================================
# KuraVet - configuracao base (comum a todos os perfis)
#
# NENHUMA CREDENCIAL AQUI.
# O banco e escolhido pelo perfil ativo:
#   oracle -> Oracle da FIAP    (Java Advanced / Mastering Database)
#   azure  -> PostgreSQL PaaS   (DevOps Tools & Cloud Computing)
# =====================================================================

spring.application.name=kuravet

# Perfil padrao para desenvolvimento local. Na Azure a variavel de
# ambiente SPRING_PROFILES_ACTIVE=azure sobrescreve este valor.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:oracle}

# O App Service Linux injeta a variavel PORT. Sem esta linha o
# healthcheck da plataforma falha e a aplicacao nao sobe.
server.port=${PORT:8080}

# Flyway - a pasta de migrations e definida por perfil
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# O schema e criado pelo Flyway; o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false

# Health check consumido no deploy e demonstrado no video
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
