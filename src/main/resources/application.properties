# =====================================================================
# KuraVet - configuracao base (comum a todos os perfis)
#
# NENHUMA CREDENCIAL AQUI.
# O banco e escolhido pelo perfil ativo:
#   oracle -> Oracle da FIAP    (Java Advanced / Mastering Database)
#   azure  -> Azure SQL PaaS    (DevOps Tools & Cloud Computing)
# =====================================================================

spring.application.name=kuravet

# Perfil padrao para desenvolvimento local. Na Azure a variavel de
# ambiente SPRING_PROFILES_ACTIVE=azure sobrescreve este valor.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:oracle}

# O App Service Linux injeta a variavel PORT. Sem esta linha o
# healthcheck da plataforma falha e a aplicacao nao sobe.
server.port=${PORT:8080}

# ---------------------------------------------------------------------
# Flyway - a pasta de migrations e definida por perfil
#
# NAO usar baseline-on-migrate: ele serve para adotar bancos legados
# que ja possuem schema. Como o banco nasce vazio, o baseline fazia o
# Flyway marcar a V1 como ja aplicada e comecar da V2, deixando as
# tabelas sem criar.
# ---------------------------------------------------------------------
spring.flyway.enabled=true

# ---------------------------------------------------------------------
# JPA
#
# ddl-auto=none: quem cria e versiona o schema e o Flyway, nao o
# Hibernate. Com "validate", o Hibernate comparava nomes de tabela e
# abortava o start por diferenca de caixa (procura "consulta", o DDL
# cria "CONSULTA"). Em producao o controle de schema pertence a
# ferramenta de migracao.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none

# open-in-view=true mantem a sessao do Hibernate aberta durante a
# renderizacao do Thymeleaf. As telas acessam associacoes lazy como
# c.pet.nome; sem isso o acesso estoura LazyInitializationException.
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false

# Health check consumido no deploy e demonstrado no video
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never